# Builds the site and syncs it to a Google Cloud Storage bucket on every push
# to main (which includes every save in Pages CMS).
#
# Set these under GitHub repo → Settings → Secrets and variables → Actions → Variables:
#   GCS_BUCKET                  e.g. www.example.com
#   GCP_WORKLOAD_IDENTITY_PROVIDER
#                               e.g. projects/123456789/locations/global/workloadIdentityPools/github/providers/my-repo
#   GCP_SERVICE_ACCOUNT         e.g. site-deployer@my-project.iam.gserviceaccount.com
# See README.md → "Deploy to Google Cloud Storage" for the one-time setup.

name: Deploy to Google Cloud Storage

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-gcs
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write # needed for keyless auth (Workload Identity Federation)

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # Keep resized images between runs so only new uploads get processed
      # (eleventy-img skips images whose output files already exist).
      - uses: actions/cache@v4
        with:
          path: _site/img
          key: eleventy-img-${{ github.run_id }}
          restore-keys: eleventy-img-

      - run: npm ci
      - run: npm run build

      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v3

      # Resized images have content-hashed filenames, so they can be cached for a year.
      - name: Upload images
        run: |
          gcloud storage rsync _site/img "gs://${{ vars.GCS_BUCKET }}/img" \
            --recursive \
            --delete-unmatched-destination-objects \
            --cache-control="public, max-age=31536000, immutable"

      # Everything else (HTML, CSS, original uploads) gets a short cache so edits show up quickly.
      - name: Upload site
        run: |
          gcloud storage rsync _site "gs://${{ vars.GCS_BUCKET }}" \
            --recursive \
            --delete-unmatched-destination-objects \
            --exclude="^img/" \
            --cache-control="public, max-age=300"
